# ⚠️  In production use Sealed Secrets, Vault, or External Secrets Operator.
# These values are base64 of: academy / academy_pass / academy_write
# echo -n "value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: academy-db-secrets
  namespace: academy
type: Opaque
data:
  postgres-user: YWNhZGVteQ==         # academy
  postgres-password: YWNhZGVteV9wYXNz # academy_pass
  postgres-db: YWNhZGVteV93cml0ZQ==   # academy_write
---
apiVersion: v1
kind: Secret
metadata:
  name: academy-api-secrets
  namespace: academy
type: Opaque
stringData:
  write-db-connection: "Host=postgres-write-svc;Port=5432;Database=academy_write;Username=academy;Password=academy_pass"
  mongodb-connection: "mongodb://mongodb-read-svc:27017"
