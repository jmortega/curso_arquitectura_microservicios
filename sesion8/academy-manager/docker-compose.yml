version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
#  Academy Manager — CQRS + Hexagonal Architecture
#
#  Write DB  →  PostgreSQL  (port 5432)   — commands, EF Core, transactional
#  Read  DB  →  MongoDB     (port 27017)  — queries, denormalized read models
#  API       →  .NET 8      (port 5000)   — REST, Swagger at http://localhost:5000
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Write Database: PostgreSQL ───────────────────────────────────────────────
  postgres-write:
    image: postgres:16-alpine
    container_name: academy-postgres-write
    restart: unless-stopped
    environment:
      POSTGRES_DB: academy_write
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_write_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy_write"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - academy-network

  # ── Read Database: MongoDB ────────────────────────────────────────────────────
  mongodb-read:
    image: mongo:7-jammy
    container_name: academy-mongodb-read
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: academy_read
    ports:
      - "27017:27017"
    volumes:
      - mongodb_read_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - academy-network

  # ── API: .NET 8 ───────────────────────────────────────────────────────────────
  academy-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academy-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__WriteDatabase: "Host=postgres-write;Port=5432;Database=academy_write;Username=academy;Password=academy_pass"
      MongoDB__ConnectionString: "mongodb://mongodb-read:27017"
      MongoDB__DatabaseName: "academy_read"
    depends_on:
      postgres-write:
        condition: service_healthy
      mongodb-read:
        condition: service_healthy
    networks:
      - academy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Mongo Express (optional UI for MongoDB read DB) ───────────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: academy-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb-read
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb-read:
        condition: service_healthy
    networks:
      - academy-network
    profiles:
      - tools

volumes:
  postgres_write_data:
    driver: local
  mongodb_read_data:
    driver: local

networks:
  academy-network:
    driver: bridge
