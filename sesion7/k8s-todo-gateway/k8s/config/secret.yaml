# ⚠️  En producción usa Sealed Secrets o External Secrets Operator.
# Valores en base64:
#   echo -n "valor" | base64
#
#   todo_user  → dG9kb191c2Vy
#   todo_pass  → dG9kb19wYXNz
#   root_pass  → cm9vdF9wYXNz
#   tododb     → dG9kb2Ri

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: todo-app
type: Opaque
data:
  mysql-root-password: cm9vdF9wYXNz   # root_pass
  mysql-user:          dG9kb191c2Vy   # todo_user
  mysql-password:      dG9kb19wYXNz   # todo_pass
  mysql-database:      dG9kb2Ri       # tododb
