# ── Gateway ───────────────────────────────────────────────────────────────────
# Define el punto de entrada al clúster.
# Equivale al "listener" del nginx Ingress Controller.
# Requiere que Envoy Gateway esté instalado (gatewayClassName: eg)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: todo-gateway
  namespace: todo-app
spec:
  gatewayClassName: eg          # "eg" es la clase que instala Envoy Gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same            # Solo acepta HTTPRoutes del mismo namespace

---
# ── HTTPRoute ─────────────────────────────────────────────────────────────────
# Define las reglas de enrutamiento HTTP.
# Equivale a las "rules" del recurso Ingress.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo-route
  namespace: todo-app
spec:
  # Vincula esta ruta al Gateway definido arriba
  parentRefs:
    - name: todo-gateway
      namespace: todo-app

  # Enruta TODO el tráfico (cualquier host) hacia el Service de la API
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /            # Captura cualquier ruta: /todos, /health, /swagger...
      backendRefs:
        - name: todo-api-svc
          port: 80
