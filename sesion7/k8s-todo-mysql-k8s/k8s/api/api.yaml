# ── Deployment — pods de la API .NET 8 ───────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo-app
  labels:
    app: todo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # Zero-downtime: siempre hay al menos 2 pods disponibles
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      # ── Init container: espera a que MySQL acepte conexiones ─────────────────
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Esperando a MySQL en mysql-svc:3306..."
              until nc -z mysql-svc 3306; do
                echo "MySQL no disponible, reintentando en 3s..."
                sleep 3
              done
              echo "MySQL listo."

      containers:
        - name: todo-api
          image: todo-api:latest
          imagePullPolicy: Never   # Usa la imagen local cargada en Minikube
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: todo-api-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

---
# ── Service — expone la API dentro del clúster ────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: todo-api-svc
  namespace: todo-app
  labels:
    app: todo-api
spec:
  selector:
    app: todo-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP

---
# ── Ingress — acceso externo al clúster vía nginx ─────────────────────────────
# Requiere: minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-ingress
  namespace: todo-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/limit-connections: "5"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"   # fuerza HTTP → HTTPS
spec:
  ingressClassName: nginx
  tls:                            # ← esto es lo que falta sin el cert
    - hosts:
        - todo.local
      secretName: todo-tls        # ← referencia al Secret con el certificado
  rules:
    - host: todo.local         # Añadir en /etc/hosts: $(minikube ip)  todo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-api-svc
                port:
                  number: 80
