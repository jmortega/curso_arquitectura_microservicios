global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "academy-api"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["academy-api:8080"]
        labels:
          service: "academy-api"
          env:     "production"

  - job_name: "academy-gateway"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["academy-gateway:8081"]
        labels:
          service: "academy-gateway"
          env:     "production"

  - job_name: "node-metrics"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
          host:    "academy-host"

  - job_name: "postgres-metrics"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgresql"
          db:      "academy_write"

  - job_name: "mongodb-metrics"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels:
          service: "mongodb"
          db:      "academy_read"
