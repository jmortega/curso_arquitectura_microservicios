# ── YARP API Gateway — Deployment ─────────────────────────────────────────────
#
#  El Gateway es stateless: no guarda estado entre peticiones.
#  Puede escalarse horizontalmente sin restricciones.
#  HPA basado en CPU (70%) y peticiones concurrentes HTTP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: academy-gateway
  namespace: academy
  labels:
    app: academy-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: academy-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # máximo 1 Pod extra durante el despliegue
      maxUnavailable: 0  # Zero-downtime: nunca baja réplicas antes de subir nuevas
  template:
    metadata:
      labels:
        app: academy-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8081"
        prometheus.io/path:   "/metrics"
    spec:
      containers:
        - name: academy-gateway
          image: academy-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "300m"
          startupProbe:
            httpGet:
              path: /metrics
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # 60s para arrancar
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: academy-gateway-svc
  namespace: academy
  labels:
    app: academy-gateway
spec:
  selector:
    app: academy-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8081
  type: ClusterIP
---
# ── HPA: escala el Gateway por CPU y peticiones HTTP ─────────────────────────
#
#  El Gateway es stateless → puede escalar sin impacto en el estado.
#  Métrica primaria: CPU al 70% de utilización media.
#  Métrica secundaria: memoria al 75%.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: academy-gateway-hpa
  namespace: academy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: academy-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30    # reacciona rápido al subir
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120   # espera más antes de bajar
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
