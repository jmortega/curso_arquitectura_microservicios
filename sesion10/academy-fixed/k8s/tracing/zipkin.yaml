# ═══════════════════════════════════════════════════════════════════════════════
#  Zipkin — Distributed Tracing (modo memoria para Minikube / dev)
#
#  Para producción usar STORAGE_TYPE=elasticsearch o STORAGE_TYPE=cassandra.
#  Documentación: https://zipkin.io/pages/quickstart.html
# ═══════════════════════════════════════════════════════════════════════════════

# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: academy
  labels:
    app: zipkin
    component: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
        component: tracing
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest
          env:
            - name: STORAGE_TYPE
              value: mem              # cambiar a "elasticsearch" en producción
          ports:
            - containerPort: 9411
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 15
            periodSeconds: 10
---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: zipkin-svc
  namespace: academy
  labels:
    app: zipkin
spec:
  selector:
    app: zipkin
  ports:
    - name: http
      port: 9411
      targetPort: 9411
  type: ClusterIP
