# ═══════════════════════════════════════════════════════════════════════════════
#  Prometheus — configuración para Academy Manager
#
#  Jobs configurados:
#    - prometheus       → métricas internas de Prometheus
#    - academy-api      → métricas de la API .NET 8 (OpenTelemetry / prometheus-net)
#    - node-metrics     → métricas del host vía Node Exporter  ← NUEVO
#    - postgres-metrics → métricas de PostgreSQL vía postgres-exporter
#    - mongodb-metrics  → métricas de MongoDB vía mongodb-exporter
# ═══════════════════════════════════════════════════════════════════════════════

global:
  scrape_interval:     15s   # frecuencia de scraping por defecto
  evaluation_interval: 15s   # frecuencia de evaluación de alertas
  scrape_timeout:      10s   # timeout por scrape

# ── Reglas de alertas (opcional, añadir ficheros en rules/) ───────────────────
# rule_files:
#   - "rules/academy-alerts.yml"

scrape_configs:

  # ── 1. Auto-monitorización de Prometheus ─────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── 2. API .NET 8 — endpoint /metrics expuesto por prometheus-net ─────────────
  - job_name: "academy-api"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["academy-api:8080"]
        labels:
          service: "academy-api"
          env:     "production"

  # ── 3. Node Exporter — métricas de infraestructura del host ──────────────────
  #
  #  Con network_mode: host, Node Exporter escucha en el puerto 9100 del host.
  #  Prometheus (en red bridge) accede al host mediante host.docker.internal.
  #
  #  NOTAS según entorno:
  #    - Linux nativo:        usar "localhost:9100"
  #    - Docker Desktop (Mac/Win): usar "host.docker.internal:9100"
  #    - Kubernetes:          usar Service Discovery (ver comentario al final)
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: "node-metrics"
    scrape_interval: 15s
    scrape_timeout:  10s
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
          host:    "academy-host"
          env:     "production"

  # ── 4. PostgreSQL Exporter ────────────────────────────────────────────────────
  - job_name: "postgres-metrics"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgresql"
          db:      "academy_write"
          env:     "production"

  # ── 5. MongoDB Exporter ───────────────────────────────────────────────────────
  - job_name: "mongodb-metrics"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels:
          service: "mongodb"
          db:      "academy_read"
          env:     "production"


# ═══════════════════════════════════════════════════════════════════════════════
#  REFERENCIA: Consultas PromQL útiles para Node Exporter
#
#  — % de uso de CPU (todos los cores):
#      100 - (avg by (instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
#
#  — RAM disponible en MB:
#      node_memory_MemAvailable_bytes / 1024 / 1024
#
#  — % de disco usado en la partición raíz:
#      100 - ((node_filesystem_avail_bytes{mountpoint="/"} * 100)
#              / node_filesystem_size_bytes{mountpoint="/"})
#
#  — Carga media del sistema (últimos 5 minutos):
#      node_load5
#
#  — Bytes recibidos por segundo en la interfaz eth0:
#      rate(node_network_receive_bytes_total{device="eth0"}[5m])
#
#  REFERENCIA: Dashboard oficial de Node Exporter en Grafana
#    Importar ID: 1860  →  "Node Exporter Full"
# ═══════════════════════════════════════════════════════════════════════════════
